# ─────────────────────────────────────────────────────────────────
# Growders MVP — railway.toml (backend)
#
# IMPORTANTE: startCommand corre PRIMERO las migraciones de Alembic
# y LUEGO arranca uvicorn. Si la migración falla, el deploy se detiene.
#
# Orden en cada deploy:
#   1. alembic upgrade head  → aplica migraciones pendientes
#   2. python -m scripts.seed_demo → inserta tenant demo si no existe
#   3. uvicorn              → arranca la app
# ─────────────────────────────────────────────────────────────────

[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "alembic upgrade head && python -m scripts.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
