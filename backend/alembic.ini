# ─────────────────────────────────────────────────────────────────
# Growders MVP — alembic.ini
#
# IMPORTANTE: sqlalchemy.url se ignora aquí.
# La URL real la inyecta env.py desde DATABASE_URL (variable de entorno).
# Esto evita hardcodear credenciales en este archivo.
# ─────────────────────────────────────────────────────────────────

[alembic]
script_location = alembic
prepend_sys_path = .

# Placeholder — env.py lo sobreescribe en runtime
sqlalchemy.url = postgresql+psycopg2://placeholder

version_path_separator = os

[post_write_hooks]
# Sin hooks por ahora

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
